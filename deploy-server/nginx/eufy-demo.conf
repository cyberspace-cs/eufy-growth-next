# ============================================================
# eufy 黑客松 demo 聚合入口 · nginx 片段
#
# 插入位置：/etc/nginx/sites-available/portfolio 里 taoxie.vip 的 443 server 块，
#          建议放在 `location ^~ /eufy/ { ... }` 之前。
# 生效：    sudo nginx -t && sudo systemctl reload nginx
#
# 目录结构与 URL 对齐，所以静态部分用一条 root + try_files 就够：
#   /eufy-demo/           → /var/www/eufy-demo/index.html          （门户）
#   /eufy-demo/cn/        → /var/www/eufy-demo/cn/index.html
#   /eufy-demo/next/      → /var/www/eufy-demo/next/index.html
#   /eufy-demo/react/     → /var/www/eufy-demo/react/index.html
# ============================================================

    # 无斜杠入口统一补斜杠，避免相对资源被解析到上一层
    location = /eufy-demo { return 301 /eufy-demo/; }

    # ---- 摄像头 Agent API（SSE：必须关缓冲 + 拉长超时）----
    # /eufy-demo/next/api/stream  →  127.0.0.1:8111/api/stream
    location ^~ /eufy-demo/next/api/ {
        proxy_pass http://127.0.0.1:8111/api/;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection        "";
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout  3600s;
        proxy_send_timeout  3600s;
        chunked_transfer_encoding on;
        add_header X-Accel-Buffering no;
    }

    # ---- 三个 demo 的静态根 ----
    location ^~ /eufy-demo/ {
        root /var/www;
        try_files $uri $uri/ =404;
    }

    # 可选：把旧的 /eufy/ 收敛到新入口（内容等价，避免两份长期不同步）
    # 确认无误后取消注释：
    # location ^~ /eufy/ { return 301 /eufy-demo/cn/; }
